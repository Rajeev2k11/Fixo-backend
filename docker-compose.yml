# Local infrastructure only. Credentials are dev defaults; override via .env.
services:
  postgres:
    image: postgis/postgis:16-3.5
    # postgis/postgis publishes amd64 images only; runs under emulation on Apple Silicon.
    platform: linux/amd64
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fixo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fixo_local_only}
      POSTGRES_DB: ${POSTGRES_DB:-fixo}
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # TCP, not the socket: during first-boot init Postgres listens on the socket only, then restarts.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  redis-data:
